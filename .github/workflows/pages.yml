# Deploys site/ to GitHub Pages on the public mirror (jagilley/abstraction).
# This file lives in the private repo and reaches the mirror through /push-to-public
# (opted in by .github/.public), so it runs when a release merges into the mirror's main.
# The repository guard keeps it from deploying anything from the private repo.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'jagilley/abstraction'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
